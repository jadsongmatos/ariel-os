[package]
name = "thermistor"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ariel-os = { path = "../../src/ariel-os", features = ["time"] }
ariel-os-boards = { path = "../../src/ariel-os-boards" }
# `rt` buffers serial input with the USART receive interrupt.
embassy-avr = { workspace = true, features = ["arduino-uno", "rt"] }
ufmt = "0.2.0"

[features]
## Uses the ATmega328P internal pull-up on `A0` instead of an external resistor.
internal-pull-up = []

[lints]
workspace = true
