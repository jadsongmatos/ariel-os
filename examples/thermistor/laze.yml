apps:
  - name: thermistor
    context:
      - avr
    selects:
      # The NTC connects between A0 and GND only. For a divider with an
      # external resistor, disable this module with `-d internal-pull-up`.
      - ?internal-pull-up

modules:
  - name: internal-pull-up
    help: use the ATmega328P internal pull-up on A0 instead of an external resistor
    env:
      global:
        FEATURES:
          - internal-pull-up
