version: 0.4.1
targets:
  unihiker-k10:
    chip: esp32-s3-wroom-1
    flags:
      - has_usb_cdc_acm_port
      - has_usb_device_port
    buttons:
      # button0
      - pin: GPIO0
        aliases:
          - BOOT
    i2c:
      - sda_pin: GPIO47
        scl_pin: GPIO48
        possible_peripherals:
          - I2C0
          - I2C1
