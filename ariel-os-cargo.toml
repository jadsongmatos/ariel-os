[profile.dev]
incremental = false
codegen-units = 1
debug = true
lto = false
opt-level = "s" # Optimize for size even in debug builds

[profile.release]
incremental = false
codegen-units = 1
debug = true # Required for defmt
lto = false
opt-level = "s"

[profile.release.package.esp-radio]
opt-level = 3

[patch.crates-io]
# ariel-os embassy forks

# includes bt-hci 0.6.0 update
cyw43 = { git = "https://github.com/ariel-os/embassy", rev = "603583d9" }
# Includes commit e349ebb that fixes some issues with some rpi-pico2-w boards, see https://github.com/ariel-os/ariel-os/issues/2192 .
cyw43-pio = { git = "https://github.com/ariel-os/embassy", rev = "603583d9" }

# branch = "embassy-embedded-hal-v0.5.0+ariel-os+flush-fix"
embassy-embedded-hal = { git = "https://github.com/ariel-os/embassy", rev = "5211daf214eecd64c6754b760fecdb1f16622312" }
# branch = "embassy-hal-internal-v0.3.0+ariel-os"
embassy-hal-internal = { git = "https://github.com/ariel-os/embassy", rev = "0feffeb3c90748112a64c6570a39e1251311accb" }
# branch = "embassy-nrf-v0.9.0+ariel-os+cryptocell"
embassy-nrf = { git = "https://github.com/ariel-os/embassy", rev = "cfaa7e92d1f79143b5e892442b1f2ff87b330770" }
# branch = "embassy-net-v0.9.1+ariel-os": backport of https://github.com/embassy-rs/embassy/pull/6195
embassy-net = { git = "https://github.com/ariel-os/embassy", rev = "37683fe299f12028e5a77af9f742f496da08afcd" }
# branch = "embassy-rp-v0.8.0+ariel-os"
embassy-rp = { git = "https://github.com/ariel-os/embassy", rev = "0314802282e112a47b4ccb303c0e7f09cf33df53" }
# branch = "embassy-stm32-v0.4.0+ariel-os"
embassy-stm32 = { git = "https://github.com/ariel-os/embassy", rev = "1b75c3d6e61a99a312e2d12f039fa6e76e9c3a9c" }
# branch = "embassy-time-v0.5.1+ariel-os"
embassy-time = { git = "https://github.com/ariel-os/embassy", rev = "3c1b5fbf28237ea7144ae970c3aec11c38023c3f" }
# branch = "embassy-usb-synopsys-otg-v0.3.1+ariel-os
embassy-usb-synopsys-otg = { git = "https://github.com/ariel-os/embassy", rev = "478df29985c8e0d0ff2e915440c8ca15e36f4403" }
# ariel-os embassy-avr fork
embassy-avr = { path = "/home/jadson/Documentos/uno/embassy/embassy-avr" }
# embassy-executor 0.9.1 with avr-device 0.8.1 for `arch-avr`, from the local embassy fork.
# Its timer-queue crate comes along, so that the executor and embassy-time-queue-utils share
# one copy.
embassy-executor = { path = "/home/jadson/Documentos/uno/embassy/embassy-executor" }
embassy-executor-timer-queue = { path = "/home/jadson/Documentos/uno/embassy/embassy-executor-timer-queue" }
# Force avr-device to 0.8.1 to avoid multiple versions (0.6.0, 0.7.0, 0.8.1)
# where 0.7.0 fails without chip feature
avr-device = { git = "https://github.com/rahix/avr-device", tag = "v0.8.1" }

# ariel-os esp-hal fork, using branch = "esp-hal-v1.0.0+20251203+ariel-os"
